  <title id="title">Sneeuw neemt kleine hoeveelheden wax mee</title>
  <desc id="desc">Het board beweegt naar rechts. Sneeuwkorrels schuren langs het glijvlak. Gouden waxdeeltjes laten los en blijven achter in de sneeuw.</desc>
