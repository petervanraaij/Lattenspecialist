<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#171816"><title>Medewerkers | De Lattenspecialist</title><link rel="icon" href="images/badge.webp"><link rel="stylesheet" href="medewerkers.css?v=1"></head>
<body><header><img src="images/badge.webp" alt="De Lattenspecialist"><div><span>DE LATTENSPECIALIST</span><strong>Werkplaats</strong></div><button id="logout" type="button" hidden>Uitloggen</button></header>
