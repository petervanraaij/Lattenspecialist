name: Android beheerapp

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile-admin/**"
      - "beheer.html"
      - "beheer.js"
      - "styles.css"
      - "booking-config.js"
      - ".github/workflows/android-app.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-admin/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - run: python -m pip install Pillow==12.3.0
      - run: npm run prepare:assets
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lattenspecialist-beheer-android
          path: mobile-admin/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
