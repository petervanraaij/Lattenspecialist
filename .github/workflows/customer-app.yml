name: Klantenapp Android en iPhone

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile-customer/**'
      - 'beheer.js'
      - 'beheer.html'
      - 'worker/**'
      - 'customer-booking.*'
      - 'booking.js'
      - 'booking-config.js'
      - 'index.html'
      - 'app.html'
      - 'customer-app.*'
      - 'pwa-install.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/customer-app.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Android
          - os: macos-latest
            platform: iPhone
    runs-on: ${{ matrix.os }}
    name: Klantenapp ${{ matrix.platform }}
    defaults:
      run:
        working-directory: mobile-customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-customer/package-lock.json
      - uses: actions/setup-java@v4
        if: matrix.platform == 'Android'
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - run: git diff --exit-code -- ../app.html ../customer-app.js ../customer-app.css ../pwa-install.js
      - run: npm test
      - run: npm --prefix ../worker test
      - run: python -m pip install Pillow==12.3.0
      - run: npm run prepare:assets
      - if: matrix.platform == 'Android'
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug assembleRelease bundleRelease
      - name: Check separate development identity
        if: matrix.platform == 'Android'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > dev-package.txt
          grep -F "package: name='nl.lattenspecialist.klanten.dev'" dev-package.txt
          grep -F "application-label:'Lattenspecialist DEV'" dev-package.txt
      - name: Prepare Google Play bundle
        if: matrix.platform == 'Android'
        run: |
          mkdir -p dist/google-play
          cp android/app/build/outputs/bundle/release/app-release.aab dist/google-play/Mijn-Lattenspecialist-unsigned.aab
          cp PLAY-CONSOLE.md dist/google-play/LEESMIJ.md
          cd dist/google-play
          sha256sum Mijn-Lattenspecialist-unsigned.aab > SHA256SUMS.txt
      - name: Prepare unsigned Android release for local signing
        if: matrix.platform == 'Android'
        run: |
          mkdir -p dist/android-release
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/android-release/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" dist/android-release/
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 dist/android-release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/android-release/app-release-unsigned.apk > dist/android-release/package-info.txt
          if grep -Fq 'application-debuggable' dist/android-release/package-info.txt; then
            echo 'Release must not be debuggable'
            exit 1
          fi
          sha256sum dist/android-release/* > dist/android-release/SHA256SUMS.txt
      - if: matrix.platform == 'iPhone'
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'Android'
        with:
          name: lattenspecialist-android-ontwikkeling
          path: mobile-customer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'Android'
        with:
          name: mijn-lattenspecialist-android-release-unsigned
          path: mobile-customer/dist/android-release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'Android'
        with:
          name: mijn-lattenspecialist-google-play-unsigned
          path: mobile-customer/dist/google-play/
          if-no-files-found: error
      - name: Release summary
        if: matrix.platform == 'Android'
        run: |
          echo '## Android development' >> "$GITHUB_STEP_SUMMARY"
          echo 'DEV APK: only for internal development; separate application ID.' >> "$GITHUB_STEP_SUMMARY"
          echo 'AAB: unsigned Google Play candidate; sign locally before uploading to an internal test.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Customers use their personal status link. No public store deployment occurs in this workflow.' >> "$GITHUB_STEP_SUMMARY"
